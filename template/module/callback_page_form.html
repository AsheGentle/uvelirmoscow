<form action="#" class="repairs-form izdeliya-v-nalichii-form send-form" method="post" id="questions" name="Остались вопросы">
<input type="hidden" name="form" class="form" value="Осталисть вопросы">
<div class="repairs-form__input-wrap izdeliya-v-nalichii-form__input-wrap">
<p class="repairs-form__input-text izdeliya-v-nalichii-form__input-text">Имя:</p>
<input class="repairs-form__input izdeliya-v-nalichii-form__input form-name" name="name" type="text" /></div>

<div class="repairs-form__input-wrap izdeliya-v-nalichii-form__input-wrap">
<p class="repairs-form__input-text izdeliya-v-nalichii-form__input-text">Ваш e-mail:</p>
<input class="repairs-form__input izdeliya-v-nalichii-form__input form-mail" name="mail" type="email" /></div>

<div class="repairs-form__input-wrap izdeliya-v-nalichii-form__input-wrap">
<p class="repairs-form__input-text izdeliya-v-nalichii-form__input-text">Телефон<span>*</span>:</p>
<input class="repairs-form__input izdeliya-v-nalichii-form__input form-phone" name="phone" placeholder="+7(___)-(___)-(___)" required="" type="tel" /></div>

<div class="repairs-form__textarea-wrap izdeliya-v-nalichii-form__textarea-wrap">
<p class="repairs-form__input-text izdeliya-v-nalichii-form__input-text">Комментарий:</p>
<textarea name="comment" class="form-comment"></textarea></div>
<button class="repairs-form__btn izdeliya-v-nalichii-form__btn form-submit" type="submit">Отправить</button></form>
